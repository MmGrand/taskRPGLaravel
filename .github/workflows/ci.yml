name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: task_rpg_test
          POSTGRES_USER: task_rpg
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U task_rpg"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DB_HOST: 127.0.0.1
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, redis
          coverage: pcov
      - run: composer install --no-interaction --prefer-dist
      # Known vulnerabilities fail the build; abandoned packages (dev-only, from laravel-lang) are only reported
      - run: composer audit --abandoned=report
      - run: cp .env.example .env && php artisan key:generate
      - run: composer lint
      - run: composer analyse
      - run: composer test:coverage
      # The committed spec must match the code: regenerate and compare.
      # Scramble reads column types from the schema, and CI has only the test database
      - run: php artisan migrate --force && composer openapi && git diff --exit-code openapi.json
        env:
          DB_DATABASE: task_rpg_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # What ships in the app bundle. The dev tooling has advisories without a non-breaking fix (vitest 4, braces)
      - run: npm audit --omit=dev
      - run: npm run check:lint
      - run: npm run check:format
      - run: npm run type-check
      - run: npm run test:ci
      - run: npm run build-only

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Before compose: otherwise Docker creates frontend/node_modules as root, as the mount point
      # of the container's node_modules volume, and the runner can no longer install into it
      - run: npm ci
      # No demo account: the test registers its own player
      - run: docker compose up -d --build
        working-directory: .
        env:
          SEED_DEMO: "false"
      # Downloads while the containers start
      - run: npx playwright install --with-deps chromium
      # The app container installs Composer packages and migrates on its first start
      - name: Wait for the stack
        run: timeout 600 sh -c 'until curl -sf http://localhost:8000/api/health >/dev/null && curl -sf http://localhost:5173 >/dev/null; do sleep 5; done'
      - run: npm run test:e2e
      - if: failure()
        run: docker compose logs --no-color
        working-directory: .
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
